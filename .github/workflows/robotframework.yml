name: Run Robot Framework Tests

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Robot Framework tags to run"
        required: false
        default: ""

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          pip install robotframework
          pip install robotframework-seleniumlibrary
          pip install selenium

      - name: Run Robot Framework tests
        run: |
          mkdir -p reports

          if [ -z "${{ github.event.inputs.tags }}" ]; then
            robot \
              --variable HEADLESS:True \
              --variable URL:${{ vars.APP_URL }} \
              --variable PASSWORD:${{ secrets.APPLICATION_PASSWORD }} \
              --outputdir reports \
              TestSuite/
          else
            robot \
              --variable HEADLESS:True \
              --variable URL:${{ vars.APP_URL }} \
              --variable PASSWORD:${{ secrets.APPLICATION_PASSWORD }} \
              --include "${{ github.event.inputs.tags }}" \
              --outputdir reports \
              TestSuite/
          fi

      - name: Upload Robot Framework reports
        uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: reports/