name: Robot Framework Manual Run

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Tag to run (e.g. TC, smoke). Leave empty for all tests"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install robotframework

      - name: Run Robot Framework Tests
        run: |
          echo "Running Robot Framework tests..."

          TAGS="${{ github.event.inputs.tags }}"

          if [ -z "$TAGS" ]; then
            robot TestSuite/
          else
            robot TestSuite/ --include "$TAGS"
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: |
            output.xml
            log.html
            report.html