name: Robot Framework Manual Run

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Optional tag to run (e.g. TC, smoke)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install robotframework

      - name: Run Robot Framework Tests
        run: |
          echo "Running Robot Framework tests..."

          if [ -n "${{ github.event.inputs.tags }}" ]; then
            robot TestSuite/ --include "${{ github.event.inputs.tags }}"
          else
            robot TestSuite/
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: |
            output.xml
            log.html
            report.html