name: Robot Framework Manual Run

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite or folder"
        required: false
        default: "TestSuite/"
      tags:
        description: "Include tags (e.g. smoke, TC)"
        required: false
        default: ""
      exclude_tags:
        description: "Exclude tags"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install robotframework

      - name: Run Robot Framework Tests
        run: |
          CMD=(robot)

          # Suite/folder
          CMD+=("${{ github.event.inputs.suite }}")

          # Include tags (if provided)
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            CMD+=("--include" "${{ github.event.inputs.tags }}")
          fi

          # Exclude tags (if provided)
          if [ -n "${{ github.event.inputs.exclude_tags }}" ]; then
            CMD+=("--exclude" "${{ github.event.inputs.exclude_tags }}")
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: |
            output.xml
            log.html
            report.html