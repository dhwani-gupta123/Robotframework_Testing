name: Run Robot Framework Tests

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Robot Framework tags to run"
        required: false
        default: ""
      environment:
        description: "Environment name"
        required: false
        default: "qa"

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install robotframework
          # Install additional libraries if needed
          pip install robotframework-seleniumlibrary

      - name: Run Robot Framework tests
        run: |
          mkdir -p reports

          if [ -z "${{ github.event.inputs.tags }}" ]; then
            robot \
              --outputdir reports \
              TestSuite/
          else
            robot \
              --include "${{ github.event.inputs.tags }}" \
              --outputdir reports \
              TestSuite
          fi

      - name: Upload Robot Framework reports
        uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: reports/