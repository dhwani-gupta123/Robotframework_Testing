- name: Run Robot Framework Tests
  run: |
    CMD=(robot)

    # suite/folder (must be before or after, both work, but keep consistent)
    CMD+=("TestSuite/")

    # include tags
    if [ -n "TC" ]; then
      CMD+=("--include" "TC")
    fi

    # exclude tags
    if [ -n "" ]; then
      CMD+=("--exclude" "")
    fi

    echo "Running: ${CMD[*]}"
    "${CMD[@]}"